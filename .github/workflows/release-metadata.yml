name: release-metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/release/v2.1.8.md"
      - ".github/workflows/release-metadata.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Aqua Focus v2.1.8 release description
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.8
          name: Aqua Focus v2.1.8
          make_latest: true
          body_path: docs/release/v2.1.8.md
