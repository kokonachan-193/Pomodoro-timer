name: android-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: aqua-focus-android-2.1.1
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.1" buildozer

      - name: Build Android APK
        working-directory: android
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer android debug

      - name: Normalize APK name
        run: |
          mkdir -p dist/android
          APK="$(find android/bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/android/AquaFocus-Android-2.1.1.apk
          ls -lh dist/android/AquaFocus-Android-2.1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AquaFocus-Android-2.1.1
          path: dist/android/AquaFocus-Android-2.1.1.apk
          if-no-files-found: error

      - name: Attach APK to v2.1.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          target_commitish: main
          name: Aqua Focus v2.1.1
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/android/AquaFocus-Android-2.1.1.apk
