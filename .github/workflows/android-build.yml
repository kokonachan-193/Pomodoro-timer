name: android-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: aqua-focus-android-1.2.0
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
          workdir: android

      - name: Normalize APK name
        run: |
          mkdir -p dist/android
          APK="$(find android/bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/android/AquaFocus-Android-1.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AquaFocus-Android-1.2.0
          path: dist/android/AquaFocus-Android-1.2.0.apk
          if-no-files-found: error

      - name: Attach APK to v1.2.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: main
          name: Aqua Focus v1.2.0
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/android/AquaFocus-Android-1.2.0.apk
