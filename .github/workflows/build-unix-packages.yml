name: build-and-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "v2_experience.py"
      - "v2_workspace.py"
      - "v2_minimal.py"
      - "extensions/**"
      - "docs/release/**"
      - "i18n.py"
      - "agiu.py"
      - "settings_store.py"
      - "requirements.txt"
      - "assets/**"
      - "scripts/**"
      - "installer/**"
      - "aqua_focus.spec"
      - ".github/workflows/build-unix-packages.yml"

permissions:
  contents: write

concurrency:
  group: aqua-focus-v2.1.3
  cancel-in-progress: true

env:
  VERSION: "2.1.3"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile main.py i18n.py agiu.py settings_store.py v2_experience.py v2_workspace.py v2_minimal.py
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows
        shell: powershell
        run: .\scripts\make_release_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/releases/AquaFocusSetup-2.1.3.exe
            dist/releases/AquaFocus-Windows-Portable-2.1.3.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile main.py i18n.py agiu.py settings_store.py v2_experience.py v2_workspace.py v2_minimal.py
      - run: sudo apt-get update && sudo apt-get install -y python3-tk libportaudio2 portaudio19-dev
      - name: Build Linux / Ubuntu
        run: |
          chmod +x scripts/build_unix.sh scripts/make_release_unix.sh
          VERSION="$VERSION" ./scripts/make_release_unix.sh
          cp "dist/releases/AquaFocus-Linux-Portable-$VERSION.tar.gz" "dist/releases/AquaFocus-Ubuntu-Portable-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/releases/AquaFocus-*-Portable-2.1.3.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile main.py i18n.py agiu.py settings_store.py v2_experience.py v2_workspace.py v2_minimal.py
      - name: Build macOS
        run: |
          chmod +x scripts/build_unix.sh scripts/make_release_unix.sh
          VERSION="$VERSION" ./scripts/make_release_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/releases/AquaFocus-macOS-2.1.3.zip

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish v2.1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.3
          target_commitish: main
          name: Aqua Focus v2.1.3
          make_latest: true
          body_path: docs/release/v2.1.3.md
          fail_on_unmatched_files: true
          files: |
            release-assets/AquaFocusSetup-2.1.3.exe
            release-assets/AquaFocus-Windows-Portable-2.1.3.zip
            release-assets/AquaFocus-macOS-2.1.3.zip
            release-assets/AquaFocus-Linux-Portable-2.1.3.tar.gz
            release-assets/AquaFocus-Ubuntu-Portable-2.1.3.tar.gz
