name: ui-screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot python3-tk libportaudio2 portaudio19-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Launch and capture
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1440x1000x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          python main.py > /tmp/aquafocus.log 2>&1 &
          APP_PID=$!
          sleep 10
          scrot -u screenshot.png || scrot screenshot.png
          kill $APP_PID || true
          test -s screenshot.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: aqua-focus-ui-screenshot
          path: screenshot.png
          if-no-files-found: error
