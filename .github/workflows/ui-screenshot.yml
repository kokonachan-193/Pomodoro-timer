name: ui-screenshot

on:
  push:
    branches: [main, "fix/restore-full-ui-preview"]
    paths:
      - "main.py"
      - "v2_minimal.py"
      - ".github/workflows/ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot python3-tk libportaudio2 portaudio19-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Launch and capture responsive previews
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1920x1200x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          capture () {
            SIZE="$1"
            OUT="$2"
            python main.py --preview-size "$SIZE" > "/tmp/aquafocus-$OUT.log" 2>&1 &
            APP_PID=$!
            sleep 8
            scrot -u "$OUT.png" || scrot "$OUT.png"
            kill $APP_PID || true
            test -s "$OUT.png"
          }
          capture 640x720 compact
          capture 1120x820 standard
          capture 1720x980 wide
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aqua-focus-ui-screenshots
          path: |
            compact.png
            standard.png
            wide.png
          if-no-files-found: error
