name: ui-screenshot

on:
  push:
    branches: [main, "fix/restore-full-ui-preview"]
    paths:
      - "main.py"
      - "v2_minimal.py"
      - ".github/workflows/ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot python3-tk libportaudio2 portaudio19-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Launch and capture responsive previews
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1920x1200x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          capture () {
            SIZE="$1"
            OUT="$2"
            python main.py --preview-size "$SIZE" > "/tmp/aquafocus-$OUT.log" 2>&1 &
            APP_PID=$!
            sleep 8
            scrot "$OUT-full.png"
            python - "$OUT-full.png" "$OUT.png" "$SIZE" <<'PY'
          import sys
          from PIL import Image
          src, dst, size = sys.argv[1:4]
          w, h = (int(v) for v in size.lower().split("x", 1))
          Image.open(src).crop((0, 0, w, h)).save(dst)
          PY
            kill $APP_PID || true
            test -s "$OUT.png"
          }
          capture 640x720 compact
          capture 1120x820 standard
          capture 1720x980 wide

          python main.py --preview-size 1120x820 --preview-focus > /tmp/aquafocus-focus.log 2>&1 &
          FOCUS_PID=$!
          sleep 8
          scrot focus-full.png
          python - <<'PY'
          from PIL import Image
          Image.open("focus-full.png").crop((0, 0, 1120, 820)).save("focus.png")
          PY
          kill $FOCUS_PID || true
          test -s focus.png

      - name: Publish preview images on main
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/ui-preview
          cp compact.png standard.png wide.png focus.png docs/ui-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-preview/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Update UI preview screenshots [skip ci]"
            git push
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aqua-focus-ui-screenshots
          path: |
            compact.png
            standard.png
            wide.png
            focus.png
          if-no-files-found: error
